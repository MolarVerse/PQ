# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Docs

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/jekyll-gh-pages.yml"
      - "docs/sphinx/**"

  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/jekyll-gh-pages.yml"
      - "docs/sphinx/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# PR docs builds run repository code with a read-only token. Deployment is
# granted write access only in its separate push-to-main job.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Requirements
        run: sudo apt-get install -y doxygen
          && sudo apt-get install -y python3-sphinx
          && pip3 install sphinx-rtd-theme
          && pip3 install breathe
          && pip3 install sphinx-sitemap
          && pip3 install sphinx==7.2.6
          && pip3 install m2r

      - name: build doxygen
        run: |
          cd docs/sphinx
          make html
          cd _build/html
          touch .nojekyll

      - name: upload built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/sphinx/_build/html
          retention-days: 1

  # Only runs on push to main, and only if validate succeeded.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: download built site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: deploy
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: site # The folder the action should deploy.
