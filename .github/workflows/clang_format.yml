name: Clang Format Check

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.clang-format'
              - '.github/workflows/clang_format.yml'
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '!external/**'

  clang-format:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    name: Check Changed C++ Files Formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: python -m pip install clang-format==20.1.3

      - name: Check formatting
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD^"
            head_sha="HEAD"
          fi

          # Make sure the .clang-format style file is parseable.
          clang-format --style=file --dump-config > /dev/null

          # Collect every C/C++ file touched by this PR (added, copied,
          # modified, or renamed — deletions are skipped), restricted to the
          # source trees we enforce and excluding the external submodules.
          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" -- \
              apps benchmarks include src tests \
              | grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' \
              | grep -v '^external/' || true
          )

          if [[ ${#changed_files[@]} -eq 0 ]]; then
            echo "No C/C++ files changed — nothing to check."
            exit 0
          fi

          # Check the formatting of the *whole* file for every changed file,
          # not just the changed lines: surrounding context (e.g. operator or
          # argument alignment) can affect how a changed line must be
          # formatted, which line-scoped checks miss (see issue #590).
          fmt_status=0
          for file in "${changed_files[@]}"; do
            [[ -f "$file" ]] || continue
            if ! file_diff=$(clang-format --style=file "$file" \
                | diff -u --label "a/$file" --label "b/$file" "$file" -); then
              echo "::error file=$file::File is not clang-format clean"
              echo "$file_diff"
              fmt_status=1
            fi
          done

          if [[ $fmt_status -ne 0 ]]; then
            echo ""
            echo "Some changed files are not formatted. Fix them with:"
            echo "  clang-format -i <file>"
          fi

          exit $fmt_status

  clang-format-gate:
    if: always()
    needs: [changes, clang-format]
    runs-on: ubuntu-24.04
    steps:
      - name: Check clang-format result
        run: |
          if [[ "${{ needs.clang-format.result }}" == "failure" ]]; then
            exit 1
          fi
          echo "OK — clang-format passed or was skipped (no relevant paths changed)"
