name: Clang Format Check

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.clang-format'
              - '.github/workflows/clang_format.yml'
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '!external/**'

  clang-format:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    name: Check Changed C++ Formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: python -m pip install clang-format==20.1.3

      - name: Check formatting
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD^"
            head_sha="HEAD"
          fi

          clang-format --style=file --dump-config > /dev/null
          git-clang-format \
            --diff \
            --binary "$(command -v clang-format)" \
            --extensions c,cc,cpp,cxx,h,hh,hpp,hxx \
            "$base_sha" \
            "$head_sha" \
            -- apps benchmarks include src tests

  clang-format-gate:
    if: always()
    needs: [changes, clang-format]
    runs-on: ubuntu-24.04
    steps:
      - name: Check clang-format result
        run: |
          if [[ "${{ needs.clang-format.result }}" == "failure" ]]; then
            exit 1
          fi
          echo "OK — clang-format passed or was skipped (no relevant paths changed)"
