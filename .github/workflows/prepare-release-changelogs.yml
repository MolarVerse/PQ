name: Prepare Release Changelogs

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-changelogs:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Read release version
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Release branches must be named release/vX.Y.Z."
            exit 1
          fi

      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PQ_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare changelogs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if grep -Fq "## [$VERSION](" CHANGELOG.md || \
             grep -Fq "## [$VERSION](" DEV-CHANGELOG.md; then
            echo "Changelogs are already prepared for $VERSION."
          else
            python3 scripts/update_changelog.py "$VERSION"
          fi

          remaining="$(find changes -type f -name '*.md' \
            ! -name 'README.md' -print)"
          if [[ -n "$remaining" ]]; then
            echo "Unprocessed changelog fragments:"
            echo "$remaining"
            exit 1
          fi

      - name: Get release bot user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          app_user="${{ steps.app-token.outputs.app-slug }}[bot]"
          user_id="$(gh api "/users/$app_user" --jq .id)"
          echo "id=$user_id" >> "$GITHUB_OUTPUT"
          echo "name=$app_user" >> "$GITHUB_OUTPUT"

      - name: Commit prepared changelogs
        env:
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          APP_USER_NAME: ${{ steps.app-user.outputs.name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "No changelog changes to commit."
            exit 0
          fi

          git config user.name "$APP_USER_NAME"
          git config user.email \
            "$APP_USER_ID+$APP_USER_NAME@users.noreply.github.com"
          git add CHANGELOG.md DEV-CHANGELOG.md changes/
          git commit -m "docs: prepare changelogs for $VERSION"
          git push origin "HEAD:$HEAD_REF"
