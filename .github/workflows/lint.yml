name: LINT

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - dev
      - main
      - NEXT
  workflow_dispatch:

# Only superseded pull_request runs are cancelled; push and manual runs each
# get their own group (see ci_build.yml for the rationale).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci_build.yml'
              - '.cmake/**'
              - 'apps/**'
              - 'include/**'
              - 'src/**'
              - 'integration_tests/**'
              - 'tests/**'
              - 'benchmarks/CMakeLists.txt'
              - 'benchmarks/src/**'
              - 'benchmarks/perf/**'
              - 'CMakeLists.txt'
              - '.clang-tidy'
              - 'tests/.clang-tidy'
              - 'benchmarks/.clang-tidy'
              - 'scripts/clang_tidy.sh'
              - '.github/workflows/lint.yml'
              - '.github/actions/setup-gcc/**'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base and head commits of the PR (or the
          # previous commit on a push) are both present for the changed-file
          # diff below.
          fetch-depth: 0

      - name: Setup GCC
        uses: ./.github/actions/setup-gcc
        with:
          packages: ninja-build clangd-20

      - name: Set clangd-20 as the default clangd
        run: sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-20 100
        shell: bash

      - name: Cache Eigen source
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: ~/eigen-src
          key: eigen-${{ hashFiles('.cmake/eigen.cmake') }}

      - name: Clone Eigen (cache miss)
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          eigen_tag=$(grep -oP 'set\(EIGEN_TAG \K[0-9.]+' .cmake/eigen.cmake)
          git clone --depth 1 --branch "$eigen_tag" https://gitlab.com/libeigen/eigen.git ~/eigen-src
        shell: bash

      - name: Setup python
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: install python dependencies
        run: |
          python -m pip install numpy tqdm
        shell: bash

      - name: Install clangd-tidy
        run: python -m pip install clangd-tidy
        shell: bash

      - name: Configure (generate compile_commands.json)
        run: |
          # Enable tests and both benchmark suites so their sources are part
          # of the compile database (googletest, google benchmark, the perf
          # harness deps) — otherwise clangd-tidy has no compile command for
          # a changed tests/ or benchmarks/ file and silently can't check it
          # (issue #620).
          #
          # No actual build is needed: FetchContent (Eigen) and the
          # googletest/mstd submodules are already fetched/checked out, so
          # their headers exist right after configure. The only reason this
          # job used to run a full build was to materialize the
          # precompiled-header (.gch) binaries that compile_commands.json
          # would otherwise reference; CMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          # keeps PCH out of the generated compile commands entirely, so
          # clangd-tidy can re-parse every file from real headers without
          # anything being built first (and without ci_build.yml's
          # authoritative build/warnings gate being duplicated here).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DBUILD_WITH_NATIVE=Off \
            -DBUILD_WITH_TESTS=On \
            -DBUILD_WITH_BENCHMARKING=On \
            -DBUILD_WITH_PERF_BENCH=On \
            -DBUILD_WITH_DOCS=Off \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src"

      - name: Run clangd-tidy on changed files
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD^"
            head_sha="HEAD"
          fi

          scripts/clang_tidy.sh --base "$base_sha" --head "$head_sha" -p build

  lint-gate:
    if: always()
    needs: [changes, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Check lint result
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            exit 1
          fi
          echo "OK — lint passed or was skipped (no relevant paths changed)"
