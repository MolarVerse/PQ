name: LINT

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci_build.yml'
              - '.cmake/**'
              - 'apps/**'
              - 'include/**'
              - 'src/**'
              - 'integration_tests/**'
              - 'tests/**'
              - 'benchmarks/CMakeLists.txt'
              - 'benchmarks/src/**'
              - 'benchmarks/perf/**'
              - 'CMakeLists.txt'
              - '.clang-tidy'
              - 'tests/.clang-tidy'
              - 'benchmarks/.clang-tidy'
              - 'scripts/clang_tidy.sh'
              - '.github/workflows/lint.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base and head commits of the PR (or the
          # previous commit on a push) are both present for the changed-file
          # diff below.
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y gcc-13 g++-13 mold ninja-build clangd-20
          sudo update-alternatives --install /usr/bin/clangd clangd /usr/bin/clangd-20 100
        shell: bash

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: lint

      - name: Setup python
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: install python dependencies
        run: |
          python -m pip install numpy
        shell: bash

      - name: Install clangd-tidy
        run: python -m pip install clangd-tidy
        shell: bash

      - name: Configure and build (generate compile_commands.json)
        run: |
          # Enable tests and both benchmark suites so their sources are part
          # of the compile database and actually compile with their deps
          # (googletest, google benchmark, the perf harness) — otherwise
          # clangd-tidy has no compile command for a changed tests/ or
          # benchmarks/ file and silently can't check it (issue #620).
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_WITH_NATIVE=Off \
            -DBUILD_WITH_TESTS=On \
            -DBUILD_WITH_BENCHMARKING=On \
            -DBUILD_WITH_PERF_BENCH=On \
            -DBUILD_WITH_DOCS=Off
          cmake --build build --parallel "$(nproc)"
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Run clangd-tidy on changed files
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$base_sha" ]]; then
            base_sha="HEAD^"
            head_sha="HEAD"
          fi

          scripts/clang_tidy.sh --base "$base_sha" --head "$head_sha" -p build

  lint-gate:
    if: always()
    needs: [changes, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: Check lint result
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]]; then
            exit 1
          fi
          echo "OK — lint passed or was skipped (no relevant paths changed)"
