name: Check PR Has Linked Issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: true

jobs:
  check-linked-issue:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
            jq -r '.pull_request | [.title, (.body // "")] | .[]' \
              "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/pq-pr-text.txt"
          else
            NUMBER="$INPUT_NUMBER"
            [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
            gh api "repos/$REPO/pulls/$NUMBER" > "$RUNNER_TEMP/pq-pr.json"
            SHA=$(jq -r '.head.sha' "$RUNNER_TEMP/pq-pr.json")
            jq -r '[.title, (.body // "")] | .[]' \
              "$RUNNER_TEMP/pq-pr.json" > "$RUNNER_TEMP/pq-pr-text.txt"
          fi
          [[ "$NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$SHA" =~ ^[0-9a-f]{40,64}$ ]] || exit 1
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check for issues in PR title/description
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Extract issue numbers using keywords: Closes, Fixes, Resolves, Related to
          ISSUE_NUMBERS=$(
            grep -oiE '(closes|fixes|resolves|related to)\s+#[0-9]+' \
              "$RUNNER_TEMP/pq-pr-text.txt" |
            grep -oE '#[0-9]+' | tr -d '#' | sort -u || true
          )

          if [ -n "$ISSUE_NUMBERS" ]; then
            echo "found_in_description=true" >> "$GITHUB_OUTPUT"
            echo "Issues found in PR description: $ISSUE_NUMBERS"

            # Link each extracted issue to this PR by adding a comment
            while IFS= read -r ISSUE_NUM; do
              if [ -n "$ISSUE_NUM" ]; then
                echo "Linking issue #$ISSUE_NUM to PR #$PR_NUMBER"
                # Check if we already linked this PR to this issue
                EXISTING=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json comments --jq '.comments[].body' 2>/dev/null | grep -c "#$PR_NUMBER" || true)
                if [ "$EXISTING" -eq 0 ]; then
                  gh issue comment "$ISSUE_NUM" --repo "$REPO" --body "🔗 Linked from PR #$PR_NUMBER" 2>/dev/null || true
                fi
              fi
            done <<< "$ISSUE_NUMBERS"
          else
            echo "found_in_description=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Query issues linked to this PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          COUNT=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 10) {
                    totalCount
                  }
                }
              }
            }' -F owner="$OWNER" -F repo="$NAME" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          # Check passes if either:
          # 1. Issues are already linked via GitHub's automated processing, OR
          # 2. Issues are mentioned in the PR title/description with keywords
          if [ "$COUNT" -eq 0 ] && [ "${{ steps.extract.outputs.found_in_description }}" == "false" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Report commit status on the PR's head SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/statuses/${{ steps.pr.outputs.sha }}" \
            -f state="${{ steps.check.outputs.state }}" \
            -f context="Check PR Has Linked Issue" \
            -f description="Manually re-checked via workflow_dispatch"

      - name: Fail job if unlinked
        if: steps.check.outputs.state == 'failure'
        run: |
          echo "::error::PR #${{ steps.pr.outputs.number }} has no issue linked. Add 'Closes #123', 'Fixes #456', 'Resolves #789', or 'Related to #999' in the PR title or description."
          exit 1
