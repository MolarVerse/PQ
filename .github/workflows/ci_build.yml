name: BUILD

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci_build.yml'
              - '.cmake/**'
              - 'apps/**'
              - 'include/**'
              - 'src/**'
              - 'integration_tests/**'
              - 'tests/**'
              - 'benchmarks/CMakeLists.txt'
              - 'benchmarks/src/**'
              - 'CMakeLists.txt'

  build:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        build: [Release, Debug]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: install gcc13
        run: |
          sudo apt update
          sudo apt install gcc-13 g++-13 mold
        shell: bash

      # safe because CI builds with -DBUILD_WITH_NATIVE=Off (portable objects)
      - name: setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build }}

      - name: setup python ubuntu
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: install python dependencies
        run: |
          python -m pip install numpy
        shell: bash

      - name: install coverage
        if : ${{ matrix.os == 'ubuntu-24.04' && matrix.build == 'Debug' }}
        run: |
          python -m pip install coverage
          python -m pip install gcovr
        shell: bash

      - name: Build and Test Project
        if : ${{ matrix.os != 'ubuntu-24.04' || (matrix.os == 'ubuntu-24.04' && matrix.build != 'Debug') }}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DBUILD_WITH_NATIVE=Off ..
          make -j$(nproc)
          make test
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Build and Test Project with coverage
        if : ${{ matrix.os == 'ubuntu-24.04' && matrix.build == 'Debug' }}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_WITH_GCOVR=ON -DBUILD_WITH_NATIVE=Off ..
          make -j$(nproc)
          make coverage_xml
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Upload coverage to Codecov
        if : ${{ matrix.os == 'ubuntu-24.04' && matrix.build == 'Debug' }}
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: true # optional (default = false)
          gcov: true
          gcov_executable: gcov-13
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup Conda Environment
        if: ${{matrix.build == 'Release'}}
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.12'
          activate-environment: test-env
          channels: default, conda-forge
          auto-activate-base: false

      - name: Cache conda env
        if: ${{matrix.build == 'Release'}}
        id: cache-conda-env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs/test-env
          key: conda-env-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci_build.yml') }}

      - name: Install Integration Test Dependencies in Conda Env
        if: ${{matrix.build == 'Release' && steps.cache-conda-env.outputs.cache-hit != 'true'}}
        run: |
          conda install -n test-env -y pip conda-forge::dftbplus conda-forge::xtb
          conda run -n test-env python -m pip install pytest pytest-cov pqanalysis ase pyscf==2.9.0

      - name: Integration Tests
        if: ${{matrix.build == 'Release' }}
        run: |
          conda run -n test-env pytest integration_tests -v

  benchmark:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install gcc13
        run: |
          sudo apt update
          sudo apt install gcc-13 g++-13
        shell: bash

      - name: Build benchmark suite
        run: |
          cmake -S . -B build-benchmark \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_BENCHMARKING=On \
            -DBUILD_WITH_TESTS=Off \
            -DBUILD_WITH_ASE=Off \
            -DBUILD_WITH_DOCS=Off \
            -DBUILD_WITH_NATIVE=Off
          cmake --build build-benchmark --target google_benchmarks -j$(nproc)
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Run benchmark smoke tests
        run: |
          ctest --test-dir build-benchmark -L benchmark --output-on-failure

  build-static-lto:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13
        run: |
          sudo apt update
          sudo apt install gcc-13 g++-13 mold ninja-build

      - name: Build and test static LTO
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_WITH_ASE=OFF \
            -DBUILD_WITH_LTO=ON \
            -DBUILD_WITH_NATIVE=OFF
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure -j1
        env:
          CC: gcc-13
          CXX: g++-13

  static-singularity-build:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install gcc-13 g++-13 mold

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: static-singularity

      - name: Build project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_WITH_SINGULARITY=ON \
            -DBUILD_WITH_TESTS=ON \
            -DBUILD_WITH_ASE=OFF \
            -DBUILD_WITH_NATIVE=OFF
          cmake --build build --parallel "$(nproc)"
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j1

  mpi-build:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install \
            gcc-13 \
            g++-13 \
            mold \
            openmpi-bin \
            libopenmpi-dev \
            python-is-python3

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpi-release

      - name: Build project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_MPI=ON \
            -DBUILD_WITH_ASE=OFF \
            -DBUILD_WITH_NATIVE=OFF \
            -DBUILD_WITH_TESTS=ON
          cmake --build build --parallel "$(nproc)"
        env:
          CC: gcc-13
          CXX: g++-13

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j1

  ci-build-gate:
    if: always()
    needs: [changes, build, benchmark, build-static-lto, mpi-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check CI build results
        run: |
          for result in \
            "${{ needs.build.result }}" \
            "${{ needs.benchmark.result }}" \
            "${{ needs.build-static-lto.result }}" \
            "${{ needs.mpi-build.result }}"; do
            if [[ "$result" == "failure" ]]; then
              exit 1
            fi
          done
          echo "OK — all CI build jobs passed or were skipped (no relevant paths changed)"
