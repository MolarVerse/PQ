name: BUILD

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - dev
      - main
      - NEXT
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Only superseded pull_request runs are cancelled. Every other event (push to
# dev/main, schedule, manual dispatch) gets its own group so it is neither
# cancelled nor queued behind another run: post-merge runs give the real
# verdict for a commit and populate the branch's cache scope.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ccache does not cache compiles that use a precompiled header unless it may
# ignore the header's defines and __DATE__/__TIME__ (measured: about 65% of the
# compiler calls of every build job were uncacheable, counter
# could_not_use_precompiled_header, #732). The cost is that an object restored
# from the cache keeps the compile date of the run that built it (printed in the
# output header; nothing built by CI is shipped).
env:
  CCACHE_SLOPPINESS: pch_defines,time_macros

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci_build.yml'
              - '.github/actions/upload-build-timings/**'
              - '.github/ci-metrics/summarise_build.py'
              - '.cmake/**'
              - 'apps/**'
              - 'include/**'
              - 'src/**'
              - 'integration_tests/**'
              - 'tests/**'
              - 'benchmarks/CMakeLists.txt'
              - 'benchmarks/src/**'
              - 'CMakeLists.txt'

  build:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        build: [Release, Debug]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: install gcc13
        run: |
          sudo apt update
          sudo apt install gcc-14 g++-14 mold
        shell: bash

      # safe because CI builds with -DBUILD_WITH_NATIVE=Off (portable objects)
      - name: setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.build }}

      # Eigen is a header-only FetchContent dependency fetched from GitLab on
      # every job that configures CMake; cache the cloned source once and
      # point every subsequent job at it via FETCHCONTENT_SOURCE_DIR_EIGEN
      # (CMake's official "use this local checkout instead of fetching"
      # mechanism) so we don't re-clone it ~10 times per PR, and so a GitLab
      # hiccup can't fail the whole matrix at once.
      - name: Cache Eigen source
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: ~/eigen-src
          key: eigen-${{ hashFiles('.cmake/eigen.cmake') }}

      - name: Clone Eigen (cache miss)
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          eigen_tag=$(grep -oP 'set\(EIGEN_TAG \K[0-9.]+' .cmake/eigen.cmake)
          git clone --depth 1 --branch "$eigen_tag" https://gitlab.com/libeigen/eigen.git ~/eigen-src
        shell: bash

      - name: setup python ubuntu
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: install python dependencies
        run: |
          python -m pip install numpy
        shell: bash

      - name: install coverage
        if : ${{ matrix.os == 'ubuntu-24.04' && matrix.build == 'Debug' }}
        run: |
          python -m pip install coverage
          python -m pip install gcovr
        shell: bash

      - name: Build and Test Project
        if : ${{ matrix.os != 'ubuntu-24.04' || (matrix.os == 'ubuntu-24.04' && matrix.build != 'Debug') }}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DBUILD_WITH_NATIVE=Off \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src" ..
          make -j$(nproc)
          make test
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Build and Test Project with coverage
        if : ${{ matrix.os == 'ubuntu-24.04' && matrix.build == 'Debug' }}
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug -DBUILD_WITH_GCOVR=ON -DBUILD_WITH_NATIVE=Off \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src" ..
          make -j$(nproc)
          make coverage_xml
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Collect build timings
        if: always()
        uses: ./.github/actions/upload-build-timings
        with:
          name: build-${{ matrix.os }}-${{ matrix.build }}
          job-id: ${{ job.check_run_id }}

      - name: Upload coverage to Codecov
        if : ${{ matrix.os == 'ubuntu-24.04' && matrix.build == 'Debug' && (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'pq-bot/')) }}
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: true # optional (default = false)
          gcov: true
          gcov_executable: gcov-14
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Setup Conda Environment
        if: ${{matrix.build == 'Release'}}
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.12'
          activate-environment: test-env
          channels: default, conda-forge
          auto-activate-base: false

      - name: Cache conda env
        if: ${{matrix.build == 'Release'}}
        id: cache-conda-env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs/test-env
          key: conda-env-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci_build.yml') }}

      - name: Install Integration Test Dependencies in Conda Env
        if: ${{matrix.build == 'Release' && steps.cache-conda-env.outputs.cache-hit != 'true'}}
        run: |
          conda install -n test-env -y pip conda-forge::dftbplus conda-forge::xtb
          conda run -n test-env python -m pip install pytest pytest-cov pqanalysis ase pyscf==2.9.0

      - name: Integration Tests
        if: ${{matrix.build == 'Release' }}
        run: |
          conda run -n test-env pytest integration_tests -v

  benchmark:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: install gcc14
        run: |
          sudo apt update
          sudo apt install gcc-14 g++-14
        shell: bash

      - name: Cache Eigen source
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: ~/eigen-src
          key: eigen-${{ hashFiles('.cmake/eigen.cmake') }}

      - name: Clone Eigen (cache miss)
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          eigen_tag=$(grep -oP 'set\(EIGEN_TAG \K[0-9.]+' .cmake/eigen.cmake)
          git clone --depth 1 --branch "$eigen_tag" https://gitlab.com/libeigen/eigen.git ~/eigen-src
        shell: bash

      - name: Build benchmark suite
        run: |
          cmake -S . -B build-benchmark \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_BENCHMARKING=On \
            -DBUILD_WITH_TESTS=Off \
            -DBUILD_WITH_ASE=Off \
            -DBUILD_WITH_DOCS=Off \
            -DBUILD_WITH_NATIVE=Off \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src"
          cmake --build build-benchmark --target google_benchmarks -j$(nproc)
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Run benchmark smoke tests
        run: |
          ctest --test-dir build-benchmark -L benchmark --output-on-failure

  # Pull requests and pushes only build the static LTO application: linking
  # the 165 test executables, each with its own whole-program LTO link, took
  # 78% of this job's CPU time (#746) and the regular build matrix already
  # runs every test. The nightly run builds and runs the tests too. Scheduled
  # workflows run on the default branch (main), so the nightly part checks
  # main and only starts working once a release brings this file to main.
  build-static-lto:
    if: >-
      !cancelled() && (
        github.event_name == 'schedule' ||
        (needs.changes.result == 'success' && needs.changes.outputs.relevant == 'true')
      )
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: |
          sudo apt update
          sudo apt install gcc-14 g++-14 mold ninja-build

      # safe because CI builds with -DBUILD_WITH_NATIVE=Off (portable objects);
      # LTO's whole-program link pass itself isn't cached by ccache, but the
      # per-file compile step is, which is most of the wall time on PRs that
      # only touch a handful of files.
      - name: setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: static-lto

      - name: Cache Eigen source
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: ~/eigen-src
          key: eigen-${{ hashFiles('.cmake/eigen.cmake') }}

      - name: Clone Eigen (cache miss)
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          eigen_tag=$(grep -oP 'set\(EIGEN_TAG \K[0-9.]+' .cmake/eigen.cmake)
          git clone --depth 1 --branch "$eigen_tag" https://gitlab.com/libeigen/eigen.git ~/eigen-src
        shell: bash

      - name: Build static LTO (with tests in the nightly run)
        id: build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_WITH_ASE=OFF \
            -DBUILD_WITH_LTO=ON \
            -DBUILD_WITH_NATIVE=OFF \
            -DBUILD_WITH_TESTS="$WITH_TESTS" \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src"
          cmake --build build --parallel
          if [[ "$WITH_TESTS" == "ON" ]]; then
            ctest --test-dir build --output-on-failure -j1
          fi
        env:
          CC: gcc-14
          CXX: g++-14
          WITH_TESTS: ${{ github.event_name == 'schedule' && 'ON' || 'OFF' }}

      - name: Collect build timings
        if: always()
        uses: ./.github/actions/upload-build-timings
        with:
          name: static-lto
          job-id: ${{ job.check_run_id }}
          build-status: ${{ steps.build.outcome }}

  static-singularity-build:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install gcc-14 g++-14 mold

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: static-singularity

      - name: Cache Eigen source
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: ~/eigen-src
          key: eigen-${{ hashFiles('.cmake/eigen.cmake') }}

      - name: Clone Eigen (cache miss)
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          eigen_tag=$(grep -oP 'set\(EIGEN_TAG \K[0-9.]+' .cmake/eigen.cmake)
          git clone --depth 1 --branch "$eigen_tag" https://gitlab.com/libeigen/eigen.git ~/eigen-src
        shell: bash

      - name: Build project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_WITH_SINGULARITY=ON \
            -DBUILD_WITH_TESTS=ON \
            -DBUILD_WITH_ASE=OFF \
            -DBUILD_WITH_NATIVE=OFF \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src"
          cmake --build build --parallel "$(nproc)"
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j1

  mpi-build:
    if: needs.changes.outputs.relevant == 'true' && github.event_name != 'schedule'
    needs: changes
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install \
            gcc-14 \
            g++-14 \
            mold \
            openmpi-bin \
            libopenmpi-dev \
            python-is-python3

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: mpi-release

      - name: Cache Eigen source
        id: cache-eigen
        uses: actions/cache@v4
        with:
          path: ~/eigen-src
          key: eigen-${{ hashFiles('.cmake/eigen.cmake') }}

      - name: Clone Eigen (cache miss)
        if: steps.cache-eigen.outputs.cache-hit != 'true'
        run: |
          eigen_tag=$(grep -oP 'set\(EIGEN_TAG \K[0-9.]+' .cmake/eigen.cmake)
          git clone --depth 1 --branch "$eigen_tag" https://gitlab.com/libeigen/eigen.git ~/eigen-src
        shell: bash

      - name: Build project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WITH_MPI=ON \
            -DBUILD_WITH_ASE=OFF \
            -DBUILD_WITH_NATIVE=OFF \
            -DBUILD_WITH_TESTS=ON \
            -DFETCHCONTENT_SOURCE_DIR_EIGEN="$HOME/eigen-src"
          cmake --build build --parallel "$(nproc)"
        env:
          CC: gcc-14
          CXX: g++-14

      - name: Collect build timings
        if: always()
        uses: ./.github/actions/upload-build-timings
        with:
          name: mpi-release
          job-id: ${{ job.check_run_id }}

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j1

  ci-build-gate:
    if: always()
    needs: [changes, build, benchmark, build-static-lto, mpi-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check CI build results
        run: |
          for result in \
            "${{ needs.build.result }}" \
            "${{ needs.benchmark.result }}" \
            "${{ needs.build-static-lto.result }}" \
            "${{ needs.mpi-build.result }}"; do
            if [[ "$result" == "failure" ]]; then
              exit 1
            fi
          done
          echo "OK — all CI build jobs passed or were skipped (no relevant paths changed)"
