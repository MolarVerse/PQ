name: BUILD

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - dev
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci_build.yml'
              - '.cmake/**'
              - 'apps/**'
              - 'include/**'
              - 'src/**'
              - 'integration_tests/**'
              - 'tests/**'
              - 'benchmarks/CMakeLists.txt'
              - 'benchmarks/src/**'
              - 'CMakeLists.txt'

  build:
    if: github.event_name != 'schedule'
    needs: changes
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        build: [Release, Debug]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: install gcc13
        if: needs.changes.outputs.relevant == 'true'
        run: |
          sudo apt update
          sudo apt install gcc-13 g++-13 mold
        shell: bash

      # ... every subsequent step gets `if: needs.changes.outputs.relevant == 'true'` ...
