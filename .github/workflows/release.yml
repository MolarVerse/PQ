name: Release Lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      version:
        description: Prepared release version in vX.Y.Z format
        required: true
        type: string
      commit:
        description: Commit or branch to publish
        required: true
        default: main
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    concurrency:
      group: prepare-release-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PQ_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Read release version
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          version="$(python3 scripts/release_version.py --prepare \
            --head-ref "$HEAD_REF" --title "$PR_TITLE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare changelogs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/update_changelog.py "$VERSION"

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify prepared changelogs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION](" CHANGELOG.md && \
             ! grep -Fq "## [$VERSION](" DEV-CHANGELOG.md; then
            echo "Changelogs are not prepared for $VERSION."
            exit 1
          fi
          remaining="$(find changes -type f -name '*.md' \
            ! -name 'README.md' -print)"
          if [[ -n "$remaining" ]]; then
            echo "Unprocessed changelog fragments:"
            echo "$remaining"
            exit 1
          fi

      - name: Get release bot user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          app_user="${{ steps.app-token.outputs.app-slug }}[bot]"
          user_id="$(gh api "/users/$app_user" --jq .id)"
          echo "id=$user_id" >> "$GITHUB_OUTPUT"
          echo "name=$app_user" >> "$GITHUB_OUTPUT"

      - name: Commit prepared changelogs
        env:
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          APP_USER_NAME: ${{ steps.app-user.outputs.name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git add CHANGELOG.md DEV-CHANGELOG.md changes/ .github/release.json
          if git diff --cached --quiet; then
            echo "No release preparation changes to commit."
            exit 0
          fi
          git config user.name "$APP_USER_NAME"
          git config user.email \
            "$APP_USER_ID+$APP_USER_NAME@users.noreply.github.com"
          git commit -m "docs: prepare changelogs for $VERSION"
          git push origin "HEAD:$HEAD_REF"

  publish-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Resolve release commit
        id: commit
        env:
          DISPATCH_COMMIT: ${{ inputs.commit }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "ref=$DISPATCH_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$MERGE_COMMIT" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.commit.outputs.ref }}
          submodules: recursive
          persist-credentials: false

      - name: Resolve release version
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$DISPATCH_VERSION"
          else
            version="$(python3 scripts/release_version.py --head-ref "$HEAD_REF" --title "$PR_TITLE")"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use vX.Y.Z format."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify prepared changelogs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION](" CHANGELOG.md && \
             ! grep -Fq "## [$VERSION](" DEV-CHANGELOG.md; then
            echo "Changelogs are not prepared for $VERSION."
            exit 1
          fi
          remaining="$(find changes -type f -name '*.md' \
            ! -name 'README.md' -print)"
          if [[ -n "$remaining" ]]; then
            echo "Unprocessed changelog fragments:"
            echo "$remaining"
            exit 1
          fi

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Require successful CI on release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/check_release_ci.py "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"

      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PQ_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish and verify release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh auth setup-git
          python3 scripts/publish_release.py "$GITHUB_REPOSITORY" "$VERSION"
