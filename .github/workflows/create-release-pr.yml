name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in vX.Y.Z format
        required: true
        type: string
      restore:
        description: Revert commit to undo before retrying a rolled-back release
        required: false
        type: string

permissions:
  contents: read

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Validate version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use vX.Y.Z format."
            exit 1
          fi

          echo "branch=release/$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PQ_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Check release does not exist
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin \
            "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin \
            "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists."
            exit 1
          fi

          existing="$(gh pr list --state open --base main --head "$BRANCH" \
            --json url --jq '.[0].url // empty')"
          if [[ -n "$existing" ]]; then
            echo "Release pull request already exists: $existing"
            exit 1
          fi

      - name: Get release bot user ID
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          app_user="${{ steps.app-token.outputs.app-slug }}[bot]"
          user_id="$(gh api "/users/$app_user" --jq .id)"
          echo "id=$user_id" >> "$GITHUB_OUTPUT"
          echo "name=$app_user" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        env:
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          APP_USER_NAME: ${{ steps.app-user.outputs.name }}
          BRANCH: ${{ steps.release.outputs.branch }}
          RESTORE_COMMIT: ${{ inputs.restore }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main dev
          git config user.name "$APP_USER_NAME"
          git config user.email \
            "$APP_USER_ID+$APP_USER_NAME@users.noreply.github.com"

          if [[ -z "$RESTORE_COMMIT" ]]; then
            git switch -c "$BRANCH" origin/dev
          else
            git switch -c "$BRANCH" origin/main
            if ! git merge-base --is-ancestor "$RESTORE_COMMIT" HEAD; then
              echo "$RESTORE_COMMIT is not part of main."
              exit 1
            fi

            if ! git revert --no-edit "$RESTORE_COMMIT"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              expected=".github/workflows/check-pr-for-release-version.yml"$'\n'".github/workflows/create-tag.yml"
              if [[ "$conflicts" != "$expected" ]]; then
                echo "Unexpected conflicts while restoring the release:"
                echo "$conflicts"
                exit 1
              fi

              git checkout --ours -- \
                .github/workflows/check-pr-for-release-version.yml \
                .github/workflows/create-tag.yml
              git add \
                .github/workflows/check-pr-for-release-version.yml \
                .github/workflows/create-tag.yml
              GIT_EDITOR=true git revert --continue
            fi

            git commit --amend \
              -m "revert: restore $VERSION release changes" \
              -m "Reapplies changes removed by $RESTORE_COMMIT."
            git merge --no-edit \
              -m "merge: update $VERSION release from dev" origin/dev
          fi

          git push --set-upstream origin "$BRANCH"

      - name: Open release pull request
        env:
          BRANCH: ${{ steps.release.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.release.outputs.number }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release-$NUMBER" \
            --body "Release $VERSION." \
            --label release
