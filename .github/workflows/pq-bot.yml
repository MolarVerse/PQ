name: PQ Bot Coworker

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: pq-bot-coworker-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  coworker:
    if: >-
      (contains(github.event.comment.body, '@pq-bot') ||
       contains(github.event.comment.body, '/pq-bot')) &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Authorize and prepare task
        id: task
        env:
          GH_TOKEN: ${{ github.token }}
          PQ_BOT_MODEL_CHEAP: ${{ vars.PQ_BOT_MODEL_CHEAP }}
          PQ_BOT_MODEL_FAST: ${{ vars.PQ_BOT_MODEL_FAST }}
          PQ_BOT_MODEL_SMART: ${{ vars.PQ_BOT_MODEL_SMART }}
        run: python3 scripts/pq_bot_coworker.py prepare "$RUNNER_TEMP"

      - name: Stage isolated model copy
        if: steps.task.outputs.run == 'true'
        run: python3 scripts/pq_bot_coworker.py stage "$RUNNER_TEMP"

      - name: Install pinned OpenCode
        if: steps.task.outputs.run == 'true'
        run: npm install --global opencode-ai@1.18.31

      - name: Edit isolated copy
        if: steps.task.outputs.run == 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: ${{ steps.task.outputs.model }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENCODE_DISABLE_CLAUDE_CODE: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_CONFIG_CONTENT: '{"permission":{"*":"deny","read":"allow","edit":"allow","glob":"allow","grep":"allow","list":"allow","external_directory":"deny"},"plugin":[],"mcp":{}}'
        run: |
          test -n "$OPENCODE_API_KEY"
          test -n "$MODEL"
          opencode --pure run --agent pq-coworker --model "$MODEL" \
            --dir "$RUNNER_TEMP/pq-model" \
            "$(cat "$RUNNER_TEMP/pq-coworker-prompt.txt")" \
            > "$RUNNER_TEMP/pq-coworker-output.txt"

      - name: Validate change without write credentials
        if: steps.task.outputs.run == 'true'
        run: python3 scripts/pq_bot_coworker.py validate "$RUNNER_TEMP"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        if: steps.task.outputs.run == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.PQ_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Publish draft PR for human review
        if: steps.task.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/pq_bot_coworker.py publish "$RUNNER_TEMP"
