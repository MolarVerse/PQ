name: Sync dev → NEXT

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-dev-into-next
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Mint bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.PQ_BOT_APP_ID }}
          private-key: ${{ secrets.PQ_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Get bot user info
        id: app-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          app_user="${{ steps.app-token.outputs.app-slug }}[bot]"
          user_id="$(gh api "/users/$app_user" --jq .id)"
          echo "id=$user_id" >> "$GITHUB_OUTPUT"
          echo "name=$app_user" >> "$GITHUB_OUTPUT"

      - name: Close stale sync PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          stale_prs="$(gh pr list \
            --base NEXT \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("merge/dev-into-NEXT")) | .number')"

          for pr_number in $stale_prs; do
            branch="$(gh pr view "$pr_number" --json headRefName --jq .headRefName)"
            echo "Closing stale sync PR #$pr_number (branch: $branch)"
            gh pr close "$pr_number" \
              --comment "Superseded by a new daily sync run."
            git push origin --delete "$branch" || true
          done

      - name: Attempt auto-merge dev into NEXT
        id: merge
        env:
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          APP_USER_NAME: ${{ steps.app-user.outputs.name }}
        run: |
          git fetch origin dev NEXT
          git config user.name "$APP_USER_NAME"
          git config user.email \
            "$APP_USER_ID+$APP_USER_NAME@users.noreply.github.com"

          git checkout NEXT
          git reset --hard origin/NEXT

          if git merge --no-edit origin/dev; then
            git push origin NEXT
            echo "result=merged" >> "$GITHUB_OUTPUT"
            echo "Auto-merged dev into NEXT successfully."
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts detected — a PR will be opened."
          fi

      - name: Create conflict-resolution PR
        if: steps.merge.outputs.result == 'conflict'
        env:
          APP_USER_ID: ${{ steps.app-user.outputs.id }}
          APP_USER_NAME: ${{ steps.app-user.outputs.name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BRANCH="merge/dev-into-NEXT-$(date +%Y%m%d-%H%M%S)"

          git config user.name "$APP_USER_NAME"
          git config user.email \
            "$APP_USER_ID+$APP_USER_NAME@users.noreply.github.com"

          git checkout -b "$BRANCH" origin/NEXT

          # Merge leaves conflict markers in the working tree
          git merge origin/dev || true

          # Stage everything (including conflict markers) so reviewers
          # can see exactly what needs to be resolved
          git add -A
          git commit -m \
            "merge: dev into NEXT (resolve conflicts before merging)"

          git push origin "$BRANCH"

          gh pr create \
            --base NEXT \
            --head "$BRANCH" \
            --title "merge: sync dev into NEXT (conflicts)" \
            --body "Automated daily sync of \`dev\` into \`NEXT\` failed due to merge conflicts.

Please resolve the conflict markers in the affected files and merge this PR to keep \`NEXT\` in sync with \`dev\`."
