name: Release PR Check

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-release:
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Read release version
        id: release
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$HEAD_REF" =~ ^release/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release branches must be named release/vX.Y.Z."
            exit 1
          fi

          if [[ "$PR_TITLE" != "Release-${version#v}" ]]; then
            echo "Release PR title must be Release-${version#v}."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Test changelog tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify prepared changelogs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if ! grep -Fq "## [$VERSION](" CHANGELOG.md && \
             ! grep -Fq "## [$VERSION](" DEV-CHANGELOG.md; then
            echo "Changelogs are not prepared for $VERSION."
            exit 1
          fi

          remaining="$(find changes -type f -name '*.md' \
            ! -name 'README.md' -print)"
          if [[ -n "$remaining" ]]; then
            echo "Unprocessed changelog fragments:"
            echo "$remaining"
            exit 1
          fi
