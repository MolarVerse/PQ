name: Collect build timings
description: >-
  Summarise the job's .ninja_log and ccache statistics and upload them as a
  short-lived artifact for the CI metrics collector (.github/ci-metrics).
  Never fails the job.

inputs:
  name:
    description: Short unique name of the job within its workflow (matrix values included).
    required: true
  build-dir:
    description: Build directory that may hold a .ninja_log.
    default: build
  ccache:
    description: Also record `ccache --print-stats`.
    default: 'true'
  job-id:
    description: REST API id of the calling job (pass `job.check_run_id`).
    default: ''

runs:
  using: composite
  steps:
    - name: Summarise build timings
      shell: bash
      continue-on-error: true
      env:
        ARTIFACT_NAME: build-timings-${{ inputs.name }}-a${{ github.run_attempt }}
        BUILD_DIR: ${{ inputs.build-dir }}
        USE_CCACHE: ${{ inputs.ccache }}
        JOB_ID: ${{ inputs.job-id }}
      run: |
        args=(--out "$RUNNER_TEMP/build-timings" --name "$ARTIFACT_NAME" --build-dir "$BUILD_DIR")
        [[ "$USE_CCACHE" == "true" ]] && args+=(--ccache)
        [[ -n "$JOB_ID" ]] && args+=(--job-id "$JOB_ID")
        python3 "$GITHUB_WORKSPACE/.github/ci-metrics/summarise_build.py" "${args[@]}"

    - name: Upload build timings
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: build-timings-${{ inputs.name }}-a${{ github.run_attempt }}
        path: ${{ runner.temp }}/build-timings
        retention-days: 14
        if-no-files-found: ignore
